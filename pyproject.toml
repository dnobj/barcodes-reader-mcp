[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "barcodes-reader-mcp"
version = "0.1.0"
description = "MCP stdio server that detects barcodes/Data Matrix and returns decoded payloads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.12.0",
  "pillow>=10.0.0",
  "zxing-cpp>=2.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
barcodes-reader-mcp = "barcodes_reader_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/barcodes_reader_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
